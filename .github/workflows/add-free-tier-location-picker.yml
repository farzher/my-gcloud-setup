name: Add free-tier location picker

on:
  push:
    branches: [main]
    paths: [.github/workflows/add-free-tier-location-picker.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Add location picker
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert old in s, f"missing expected text in {path}"
              p.write_text(s.replace(old, new, 1))

          Path("location.go").write_text('''package main

type locationChoice struct {
	Label  string
	Place  string
	Region string
}

var freeLocations = []locationChoice{
	{Label: "East Coast", Place: "South Carolina", Region: "us-east1"},
	{Label: "Central", Place: "Iowa", Region: "us-central1"},
	{Label: "West Coast", Place: "Oregon", Region: "us-west1"},
}

func zoneForRegion(region string) string {
	switch region {
	case "us-east1", "us-central1", "us-west1":
		return region + "-b"
	default:
		return ""
	}
}
''')

          replace("state.go",
          '''\tBilling  map[string]string `json:"billing,omitempty"`\n\tRepos    map[string]string `json:"repos,omitempty"`\n\tDisabled map[string]bool   `json:"disabled,omitempty"`\n''',
          '''\tBilling  map[string]string `json:"billing,omitempty"`\n\tRegions  map[string]string `json:"regions,omitempty"`\n\tRepos    map[string]string `json:"repos,omitempty"`\n\tDisabled map[string]bool   `json:"disabled,omitempty"`\n''')

          replace("state.go",
          '''func (c config) billingFor(account string) string { return c.Billing[account] }\n\nfunc (c config) repoFor(account string) string { return c.Repos[account] }\n''',
          '''func (c config) billingFor(account string) string { return c.Billing[account] }\n\nfunc (c config) regionFor(account string) string { return c.Regions[account] }\n\nfunc (c config) region() string { return c.regionFor(c.Account) }\n\nfunc (c config) zone() string { return zoneForRegion(c.region()) }\n\nfunc (c config) repoFor(account string) string { return c.Repos[account] }\n''')

          replace("state.go",
          '''func (c *config) setBilling(account, value string) {\n\tif c.Billing == nil {\n\t\tc.Billing = map[string]string{}\n\t}\n\tc.Billing[account] = value\n}\n\nfunc (c *config) setRepo(account, value string) {\n''',
          '''func (c *config) setBilling(account, value string) {\n\tif c.Billing == nil {\n\t\tc.Billing = map[string]string{}\n\t}\n\tc.Billing[account] = value\n}\n\nfunc (c *config) setRegion(account, value string) {\n\tif c.Regions == nil {\n\t\tc.Regions = map[string]string{}\n\t}\n\tc.Regions[account] = value\n}\n\nfunc (c *config) setRepo(account, value string) {\n''')

          replace("util.go",
          '''\tc := config{Projects: map[string]string{}, Names: map[string]string{}, Domains: map[string]string{}, Billing: map[string]string{}, Repos: map[string]string{}, Disabled: map[string]bool{}}\n''',
          '''\tc := config{Projects: map[string]string{}, Names: map[string]string{}, Domains: map[string]string{}, Billing: map[string]string{}, Regions: map[string]string{}, Repos: map[string]string{}, Disabled: map[string]bool{}}\n''')

          replace("util.go",
          '''\tif c.Billing == nil {\n\t\tc.Billing = map[string]string{}\n\t}\n\tif c.Repos == nil {\n''',
          '''\tif c.Billing == nil {\n\t\tc.Billing = map[string]string{}\n\t}\n\tif c.Regions == nil {\n\t\tc.Regions = map[string]string{}\n\t}\n\tif c.Repos == nil {\n''')

          replace("tui.go",
          '''\tregion      = "us-east1"\n\tzone        = "us-east1-b"\n\tvmName      = "server"\n''',
          '''\tvmName      = "server"\n''')

          replace("tui.go",
          '''\tscreenBillingPick\n\tscreenServer\n''',
          '''\tscreenBillingPick\n\tscreenLocation\n\tscreenServer\n''')

          replace("tui.go",
          '''\tbillingSetupPos int\n\taccountPos      int\n''',
          '''\tbillingSetupPos int\n\taccountPos      int\n\tlocationPos     int\n''')

          replace("tui_view.go",
          '''\tcase screenBillingPick:\n\t\treturn m.renderBilling()\n\tcase screenServer:\n''',
          '''\tcase screenBillingPick:\n\t\treturn m.renderBilling()\n\tcase screenLocation:\n\t\treturn m.renderLocation()\n\tcase screenServer:\n''')

          replace("tui_view.go",
          '''func (m model) renderBilling() string {\n''',
          '''func (m model) renderLocation() string {\n\tvar b strings.Builder\n\tb.WriteString(m.header() + "\\n\\n" + titleStyle.Render("Location") + "\\n")\n\tb.WriteString(accentStyle.Render(m.state.Account) + "\\n\\n")\n\tb.WriteString(mutedStyle.Render("Choose a Free Tier e2-micro region.") + "\\n\\n")\n\tfor i, loc := range freeLocations {\n\t\tb.WriteString(choiceLine(loc.Label+" · "+loc.Place, i == m.locationPos) + "\\n")\n\t}\n\tb.WriteString("\\n" + mutedStyle.Render("All three are Free Tier eligible."))\n\tb.WriteString("\\n\\n" + mutedStyle.Render("↑/↓  enter  a account  q"))\n\treturn b.String()\n}\n\nfunc (m model) renderBilling() string {\n''')

          replace("tui_update.go",
          '''\tcase screenBillingPick:\n\t\tswitch k {\n''',
          '''\tcase screenLocation:\n\t\tswitch k {\n\t\tcase "up", "k":\n\t\t\tm.locationPos--\n\t\t\tif m.locationPos < 0 {\n\t\t\t\tm.locationPos = len(freeLocations) - 1\n\t\t\t}\n\t\tcase "down", "j", "tab":\n\t\t\tm.locationPos = (m.locationPos + 1) % len(freeLocations)\n\t\tcase "enter":\n\t\t\tloc := freeLocations[m.locationPos]\n\t\t\tm.cfg.setRegion(m.state.Account, loc.Region)\n\t\t\tif err := saveConfig(m.cfg); err != nil {\n\t\t\t\treturn m.showError(screenLocation, err, err.Error())\n\t\t\t}\n\t\t\treturn m, m.route()\n\t\tcase "a":\n\t\t\tm.screen = screenAccount\n\t\t\tm.accountPos = activeAccountPos(m.state.Accounts, m.state.Account)\n\t\tcase "q":\n\t\t\treturn m, tea.Quit\n\t\t}\n\tcase screenBillingPick:\n\t\tswitch k {\n''')

          replace("tui_actions.go",
          '''\tif strings.TrimSpace(m.cfg.nameFor(m.state.Account)) == "" {\n\t\tm.editingSite = true\n\t\tm.siteInput, m.siteError = "", ""\n\t\treturn nil\n\t}\n\tif m.cfg.disabledFor(m.state.Account) {\n''',
          '''\tif strings.TrimSpace(m.cfg.nameFor(m.state.Account)) == "" {\n\t\tm.editingSite = true\n\t\tm.siteInput, m.siteError = "", ""\n\t\treturn nil\n\t}\n\tif m.cfg.regionFor(m.state.Account) == "" {\n\t\tm.screen = screenLocation\n\t\tm.locationPos = 0\n\t\treturn nil\n\t}\n\tif m.cfg.disabledFor(m.state.Account) {\n''')

          # Regional/zonal resources always use the selected account's Free Tier location.
          for p in Path(".").glob("*.go"):
              s = p.read_text()
              s = s.replace('"--region="+region', '"--region="+cfg.region()')
              s = s.replace('"--zone="+zone', '"--zone="+cfg.zone()')
              p.write_text(s)

          # Detection should not probe regional resources until a location is chosen.
          replace("detect.go",
          '''\tif s.ProjectOK {\n''',
          '''\tif s.ProjectOK {\n''')
          p = Path("detect.go")
          s = p.read_text()
          marker = '''\tif r, err = run(ctx, "gcloud", "compute", "instances", "describe", vmName, "--project="+project, "--zone="+cfg.zone(), "--format=json"); err == nil && r.Stdout != "" {\n'''
          assert marker in s
          s = s.replace(marker, '''\tif cfg.region() == "" {\n\t\treturn s, nil\n\t}\n\n''' + marker, 1)
          p.write_text(s)

          # Ensure every old hard-coded regional flag was converted.
          for p in Path(".").glob("*.go"):
              s = p.read_text()
              assert '"--region="+region' not in s, p
              assert '"--zone="+zone' not in s, p

      - name: Format and verify
        run: |
          gofmt -w .
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test ./...
          go build ./...
          GOOS=windows GOARCH=amd64 go build -o /tmp/cloud.exe .
      - name: Commit
        run: |
          rm -f .github/workflows/add-free-tier-location-picker.yml
          git config user.name "farzher"
          git config user.email "farzher@farzher.com"
          git add -A
          git commit -m "Add Free Tier location picker"
          git push

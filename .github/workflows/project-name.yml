name: Project display names

on:
  push:
    branches: [main]
    paths: [.github/workflows/project-name.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: python scripts/patch-project-name.py
      - name: Verify
        run: |
          gofmt -w main.go
          go mod tidy
          go build ./...
      - name: Commit
        run: |
          rm -f scripts/patch-project-name.py .github/workflows/project-name.yml
          git config user.name "farzher"
          git config user.email "farzher@farzher.com"
          git add -A
          git commit -m "Add project display names"
          git push

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: Build Linux
        run: go build -o /tmp/cloud .
      - name: Build Windows
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/cloud.exe .

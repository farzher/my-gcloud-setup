name: Minimal TUI

on:
  push:
    branches: [main]
    paths: [.github/workflows/minimal-ui.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Simplify UI
        shell: python
        run: |
          from pathlib import Path

          p = Path("main.go")
          s = p.read_text()

          def replace_between(start, end, replacement):
              global s
              a = s.index(start)
              b = s.index(end, a)
              s = s[:a] + replacement + s[b:]

          s = s.replace('"Switch Google account"', '"Account"')
          s = s.replace('boxWidth := 58', 'boxWidth := 50')

          replace_between(
              'func (m model) render() string {',
              'func (m model) header() string {',
              r'''func (m model) render() string {
                  switch m.screen {
                  case screenLoading:
                      return m.header() + "\n\n" + spinner(m.frame) + " gcloud"
                  case screenNeedGcloud:
                      return m.header() + "\n\n" +
                          badStyle.Render("gcloud not found") + "\n\n" +
                          button("Install gcloud", true) + "\n\n" +
                          mutedStyle.Render("enter  r  q")
                  case screenSignIn:
                      return m.renderSignIn()
                  case screenBilling:
                      return m.header() + "\n\n" +
                          goodStyle.Render("✓ "+m.state.Account) + "\n\n" +
                          titleStyle.Render("Billing") + "\n\n" +
                          button("Open billing", true) + "\n\n" +
                          mutedStyle.Render("enter  r  q")
                  case screenBillingPick:
                      return m.renderBillingPick()
                  case screenCreate:
                      return m.renderCreate()
                  case screenProvision:
                      return m.renderProvision()
                  case screenDashboard:
                      return m.renderDashboard()
                  case screenConfirm:
                      return m.renderConfirm()
                  case screenDetails:
                      return m.renderDetails()
                  default:
                      return m.header()
                  }
              }

              func (m model) renderSignIn() string {
                  var b strings.Builder
                  b.WriteString(m.header())
                  b.WriteString("\n\n")
                  b.WriteString(titleStyle.Render("Sign in"))
                  b.WriteString("\n\n")
                  b.WriteString(loginChoice("Browser", m.signInPos == 0))
                  b.WriteString("\n")
                  b.WriteString(loginChoice("QR code", m.signInPos == 1))
                  b.WriteString("\n\n")
                  b.WriteString(mutedStyle.Render("↑/↓  enter  q"))
                  return b.String()
              }

              func loginChoice(title string, active bool) string {
                  marker := "  "
                  border := muted
                  if active {
                      marker, border = "› ", accent
                  }
                  style := lipgloss.NewStyle().
                      Width(24).
                      Padding(0, 1).
                      Border(lipgloss.RoundedBorder()).
                      BorderForeground(border)
                  if active {
                      style = style.Foreground(bright).Bold(true)
                  }
                  return style.Render(marker + title)
              }

              ''',
          )

          replace_between(
              'func (m model) renderBillingPick() string {',
              'func (m model) renderCreate() string {',
              r'''func (m model) renderBillingPick() string {
                  var b strings.Builder
                  b.WriteString(m.header())
                  b.WriteString("\n\n")
                  b.WriteString(titleStyle.Render("Billing"))
                  b.WriteString("\n\n")
                  for i, a := range m.billing {
                      name := a.DisplayName
                      if name == "" {
                          name = a.id()
                      }
                      if i == m.billingPos {
                          b.WriteString(accentStyle.Render("› " + name))
                      } else {
                          b.WriteString("  " + name)
                      }
                      b.WriteString("\n")
                  }
                  b.WriteString("\n")
                  b.WriteString(mutedStyle.Render("↑/↓  enter  q"))
                  return b.String()
              }

              ''',
          )

          replace_between(
              'func (m model) renderCreate() string {',
              'func (m model) renderProvision() string {',
              r'''func (m model) renderCreate() string {
                  var b strings.Builder
                  b.WriteString(m.header())
                  b.WriteString("\n\n")
                  if m.cfg.Project == "" {
                      b.WriteString(titleStyle.Render("New server"))
                  } else {
                      b.WriteString(titleStyle.Render("Resume"))
                  }
                  b.WriteString("\n\n")
                  b.WriteString("e2-micro · Debian 13\n")
                  b.WriteString("30 GB pd-standard\n")
                  b.WriteString(zone + " · Premium · static IPv4\n")
                  b.WriteString("22 · 80 · 443 · Hermes root\n\n")
                  b.WriteString(button("Create", true))
                  b.WriteString("\n\n")
                  b.WriteString(mutedStyle.Render("enter  a account  q"))
                  return b.String()
              }

              ''',
          )

          replace_between(
              'func (m model) renderProvision() string {',
              'func (m model) renderDashboard() string {',
              r'''func (m model) renderProvision() string {
                  var b strings.Builder
                  b.WriteString(m.header())
                  b.WriteString("\n\n")
                  b.WriteString(titleStyle.Render("Provision"))
                  b.WriteString("\n\n")
                  for _, s := range m.steps {
                      icon := mutedStyle.Render("·")
                      switch s.State {
                      case 1:
                          icon = accentStyle.Render(spinner(m.frame))
                      case 2:
                          icon = goodStyle.Render("✓")
                      case 3:
                          icon = badStyle.Render("✕")
                      }
                      line := fmt.Sprintf("%s %-18s", icon, s.Name)
                      if s.Detail != "" {
                          line += " " + mutedStyle.Render(s.Detail)
                      }
                      b.WriteString(line + "\n")
                  }
                  if !m.busy && m.stepIndex < len(m.steps) && m.steps[m.stepIndex].State == 3 {
                      b.WriteString("\n")
                      b.WriteString(badStyle.Render(shortError(m.lastErr)))
                      b.WriteString("\n\n")
                      b.WriteString(mutedStyle.Render("r retry  d details"))
                      if hasExecutable("pi") {
                          b.WriteString(mutedStyle.Render("  p Pi"))
                      }
                  }
                  return b.String()
              }

              ''',
          )

          replace_between(
              'func (m model) renderDashboard() string {',
              'func (m model) renderConfirm() string {',
              r'''func (m model) renderDashboard() string {
                  status := strings.ToUpper(m.state.Instance.Status)
                  statusView := goodStyle.Render("● " + status)
                  if status != "RUNNING" {
                      statusView = warnStyle.Render("● " + status)
                  }
                  ip := m.state.Instance.ip()
                  if ip == "" {
                      ip = m.state.StaticIP
                  }
                  if ip == "" {
                      ip = "—"
                  }

                  var b strings.Builder
                  b.WriteString(m.header())
                  b.WriteString("\n\n")
                  b.WriteString(titleStyle.Render(vmName) + "  " + statusView + "\n")
                  b.WriteString(titleStyle.Render(ip) + "\n")
                  b.WriteString(mutedStyle.Render(m.state.Account) + "\n\n")
                  for i, item := range m.menu {
                      if i == m.menuPos {
                          b.WriteString(accentStyle.Render("› " + item))
                      } else {
                          b.WriteString("  " + item)
                      }
                      b.WriteString("\n")
                  }
                  if m.statusText != "" {
                      b.WriteString("\n" + spinner(m.frame) + " " + m.statusText)
                  }
                  b.WriteString("\n\n")
                  b.WriteString(mutedStyle.Render("↑/↓  enter  r  q"))
                  return b.String()
              }

              ''',
          )

          replace_between(
              'func (m model) renderConfirm() string {',
              'func (m model) renderDetails() string {',
              r'''func (m model) renderConfirm() string {
                  var title string
                  var opts []string
                  switch m.confirm {
                  case confirmRebuild:
                      title = "Rebuild?"
                      opts = []string{"Rebuild · keep IP", "Cancel"}
                  case confirmDestroy:
                      title = "Destroy?"
                      opts = []string{"VM · keep IP", "VM + IP", "Cancel"}
                  }
                  var b strings.Builder
                  b.WriteString(m.header() + "\n\n")
                  b.WriteString(badStyle.Render(title) + "\n\n")
                  for i, opt := range opts {
                      if i == m.confirmPos {
                          b.WriteString(accentStyle.Render("› " + opt))
                      } else {
                          b.WriteString("  " + opt)
                      }
                      b.WriteString("\n")
                  }
                  b.WriteString("\n" + mutedStyle.Render("↑/↓  enter  esc"))
                  return b.String()
              }

              ''',
          )

          # Keep details useful, only shorten its footer/copy.
          s = s.replace('text = "No additional output."', 'text = "—"')
          s = s.replace('mutedStyle.Render("enter/esc back")', 'mutedStyle.Render("enter/esc")')
          s = s.replace('mutedStyle.Render("   p fix with Pi")', 'mutedStyle.Render("  p Pi")')

          # Remote QR handoff should be just as terse.
          start = s.index('func renderAuthQR(out io.Writer, url string) {')
          end = s.index('func runRemoteAuth() error {', start)
          s = s[:start] + r'''func renderAuthQR(out io.Writer, url string) {
              fmt.Fprintln(out)
              qrterminal.GenerateWithConfig(url, qrterminal.Config{
                  Level:      qrterminal.M,
                  Writer:     out,
                  HalfBlocks: true,
                  QuietZone:  1,
              })
              fmt.Fprintln(out)
              fmt.Fprintln(out, url)
              fmt.Fprintln(out)
          }

          ''' + s[end:]

          p.write_text(s)

      - name: Format and verify
        run: |
          gofmt -w main.go
          go mod tidy
          go build ./...
      - name: Commit
        run: |
          rm -f .github/workflows/minimal-ui.yml
          git config user.name "farzher"
          git config user.email "farzher@farzher.com"
          git add -A
          git commit -m "Simplify TUI"
          git push
